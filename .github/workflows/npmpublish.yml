name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6

      - name: 🛠️ Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: 📦 Install Dependencies
        run: bun install

      - name: 🏗️ Build
        run: bun build src/index.js --target=bun --format=esm --minify --outfile=bin/index.js
      
      - name: 🚀 Publish
        run: bun publish